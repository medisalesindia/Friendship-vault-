<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>

<div class="hero">

<img src="Images/maanveer.jpg" class="hero-image">

<div class="overlay">

<h1>Happy Friendship Day ❤️</h1>

<h2>Maanveer</h2>

<button class="music-btn">
▶ Play Stand By Me
</button>

</div>

</div>

<section class="message-section">

<h2>A Message For You 💙</h2>

<p id="typewriter">

</p>

<a href="choose.html" class="back-btn">

⬅ Back to Friends

</a>

</section>

<script>

const text=`Some people come into our lives and leave memories.

But a few become a part of our story forever.

Thank you for every laugh,
every joke,
every crazy plan,
and every unforgettable memory.

No matter where life takes us,
I know our friendship will always stay special.

Happy Friendship Day, Brother! ❤️

— Rajveer`;

let i=0;

function typing(){

if(i<text.length){

document.getElementById("typewriter").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,35);

}

}

typing();

</script>

</body>
