<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day - Maanveer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="hero">

<img src="Images/maanveer.jpg" class="hero-image">

<div class="overlay">

<h1>Happy Friendship Day ❤️</h1>

<h2>Maanveer</h2>

<button class="music-btn">
▶ Play Stand By Me
</button>

</div>

</div>

<section class="message-section">

<h2>A Message For You 💙</h2>

<p id="typewriter">

</p>

<a href="choose.html" class="back-btn">

⬅ Back to Friends

</a>

</section>

<script>

const text=`Some people come into our lives and leave memories.

But a few become a part of our story forever.

Thank you for every laugh,
every joke,
every crazy plan,
and every unforgettable memory.

No matter where life takes us,
I know our friendship will always stay special.

Happy Friendship Day, Brother! ❤️

— Rajveer`;

let i=0;

function typing(){

if(i<text.length){

document.getElementById("typewriter").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,35);

}

}
<div class="hearts"></div>

<script>

const hearts=document.querySelector(".hearts");

for(let i=0;i<25;i++){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"%";

heart.style.animationDuration=(5+Math.random()*5)+"s";

heart.style.fontSize=(16+Math.random()*20)+"px";

heart.style.animationDelay=Math.random()*5+"s";

hearts.appendChild(heart);

}

</script>
typing();

</script>

</body>
<div class="loading-screen" id="loading">

<h2>Preparing your surprise...</h2>

<div class="loader">
<span></span>
</div>
<script>

window.addEventListener("load",()=>{

setTimeout(()=>{

document.getElementById("loading").style.opacity="0";

setTimeout(()=>{

document.getElementById("loading").style.display="none";

document.body.classList.add("fade-in");

},800);

},3000);

});

</script>
</div>
</html>
